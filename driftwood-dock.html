<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7' shape-rendering='crispEdges'%3E%3Crect x='0' y='0' width='2' height='7' fill='%23e2512a'/%3E%3Crect x='0' y='5' width='5' height='2' fill='%23e2512a'/%3E%3Crect x='5' y='2' width='1' height='3' fill='%23f2c14e'/%3E%3Crect x='4' y='4' width='1' height='1' fill='%23f2c14e'/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driftwood Dock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Layout: a harbor console. Pixel scene and catch log on the left, a tabbed tackle box of upgrades on the right; stacks to one column on phones. */
:root{
  --ink:#0e1322;      /* page water */
  --hull:#151d34;     /* sunken panels */
  --deck:#1e2946;     /* raised panels */
  --deck-hi:#2b3a63;  /* highlights, disabled fills */
  --edge:#060912;     /* pixel outlines */
  --foam:#ece6d2;     /* text */
  --mist:#95a2c4;     /* muted text */
  --buoy:#ff6a3d; --buoy-hi:#ff9a72; --buoy-lo:#b8432a;
  --kelp:#62cf94; --kelp-hi:#9be8bd; --kelp-lo:#2f8a5a;
  --brass:#f2c14e;
  --r0:#b9c2d8; --r1:#6fd08c; --r2:#5aa8ff; --r3:#c77dff; --r4:#ffb938;
  --f-display:"Jersey 10", "Silkscreen", ui-monospace, Menlo, monospace;
  --f-body:"Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
  --f-label:"Silkscreen", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html,body{background:var(--ink);color:var(--foam)}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 40px;
  background-image:radial-gradient(var(--hull) 1px, transparent 1.5px);
  background-size:8px 8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
img.px, canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.frame{box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge)}
:focus-visible{outline:2px dashed var(--brass);outline-offset:5px}

/* ---------- header ---------- */
.top{max-width:1240px;margin:0 auto 22px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.brand img{width:48px;height:auto}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,9vw,44px);line-height:.9;letter-spacing:.01em;color:var(--foam);text-shadow:3px 3px 0 var(--edge)}
.angler{display:grid;gap:4px;font-family:var(--f-label);font-size:10px;letter-spacing:.08em;color:var(--mist);text-transform:uppercase}
.xpbar{width:120px;height:8px;background:var(--hull);box-shadow:-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge),0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge)}
.xpbar i{display:block;height:100%;background:var(--brass);width:0}
.res{display:flex;flex-wrap:wrap;gap:10px 14px;margin-left:auto;align-items:center}
.res .chip{font-size:18px}
.res .chip.coins{font-size:26px;color:var(--brass)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:17px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip img{width:20px;height:20px}
.res .chip.coins img{width:26px;height:26px}
.chip.no{color:var(--buoy-hi)}
.chip.ok{color:var(--foam)}
.ghost{font-family:var(--f-label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--mist);cursor:pointer;padding:6px 4px}
.ghost:hover{color:var(--foam)}

/* ---------- layout ---------- */
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:28px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
.harbor{display:grid;gap:20px;min-width:0}

.scene{position:relative;background:var(--edge);line-height:0}
.scene canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;cursor:pointer;max-width:100%}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1.2}
.zonetag{position:absolute;left:10px;top:8px;font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--foam);background:rgba(6,9,18,.6);padding:4px 7px;line-height:1.2;pointer-events:none}
.ft{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-display);font-size:clamp(17px,2.3vw,25px);color:var(--brass);white-space:nowrap;
  text-shadow:2px 0 var(--edge),-2px 0 var(--edge),0 2px var(--edge),0 -2px var(--edge);animation:rise 1.3s steps(13) forwards}
.ft.small{font-size:clamp(13px,1.6vw,17px);color:var(--foam)}
.ft.mat{color:var(--kelp-hi);font-size:clamp(14px,1.8vw,19px)}
@keyframes rise{from{opacity:1;translate:0 0}70%{opacity:1}to{opacity:0;translate:0 -30px}}
.banner{position:absolute;left:50%;top:13%;transform:translateX(-50%);text-align:center;font-family:var(--f-display);line-height:.95;
  padding:8px 16px 10px;background:var(--hull);color:var(--foam);animation:pop 2.6s steps(20) forwards;white-space:nowrap}
.banner small{display:block;font-family:var(--f-label);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.banner b{font-weight:400;font-size:clamp(22px,3.4vw,34px)}
@keyframes pop{0%{opacity:0;translate:0 8px}8%{opacity:1;translate:0 0}85%{opacity:1}100%{opacity:0}}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.status{flex:1 1 220px;min-width:0;color:var(--mist);font-size:15px}
.status b{color:var(--foam);font-weight:500}
.auto{display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);cursor:pointer}
.auto input{accent-color:var(--kelp);width:16px;height:16px}

.btn{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;color:var(--edge);background:var(--kelp);border:0;padding:10px 14px;cursor:pointer;white-space:nowrap;
  box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),inset 0 -3px 0 0 var(--kelp-lo),inset 0 3px 0 0 var(--kelp-hi)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),inset 0 3px 0 0 var(--kelp-lo)}
.btn:disabled{background:var(--deck-hi);color:var(--mist);cursor:not-allowed;box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),inset 0 -3px 0 0 var(--hull)}
.btn.cast{font-size:15px;padding:16px 22px;min-width:190px;background:var(--buoy);
  box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),inset 0 -4px 0 0 var(--buoy-lo),inset 0 4px 0 0 var(--buoy-hi)}
.btn.cast.wait{background:var(--deck-hi);color:var(--foam);box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),inset 0 -4px 0 0 var(--hull)}
.btn.cast.bite{background:var(--brass);animation:throb .32s steps(2) infinite}
@keyframes throb{50%{transform:translateY(-2px)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:0}
.stats div{background:var(--hull);padding:9px 11px 8px;box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge)}
.stats dt{font-family:var(--f-label);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.stats dd{margin:2px 0 0;font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}

.log{background:var(--hull);padding:14px 16px}
.log h2,.box h2{font-family:var(--f-label);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.log ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:10px;min-height:28px}
.log li img{width:auto;height:22px;max-width:44px;justify-self:center}
.log li .n{font-weight:600}
.log li .d{color:var(--mist);font-size:14px}
.log li .tag{font-family:var(--f-label);font-size:9px;letter-spacing:.08em;padding:2px 5px;margin-left:6px;background:var(--deck-hi);color:var(--foam);vertical-align:2px}
.log li .tag.new{background:var(--brass);color:var(--edge)}
.log li.empty{display:block;color:var(--mist)}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}

/* ---------- tackle box ---------- */
.box{background:var(--hull);min-width:0;position:sticky;top:calc(16px + env(safe-area-inset-top, 0px));max-height:calc(100dvh - 36px);overflow:auto;overscroll-behavior:contain}
@media (max-width:920px){.box{position:static;max-height:none;overflow:visible}}
.tabs{display:flex;flex-wrap:wrap;gap:0;background:var(--edge);position:sticky;top:0;z-index:2}
.tab{flex:1 1 auto;font-family:var(--f-label);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--mist);background:var(--hull);border:0;padding:12px 6px 10px;cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 -3px 0 0 var(--edge)}
.tab:hover{color:var(--foam)}
.tab[aria-selected="true"]{background:var(--deck);color:var(--foam);box-shadow:inset 0 3px 0 0 var(--buoy)}
.tab .dot{display:inline-block;width:6px;height:6px;background:var(--kelp);margin-left:6px;vertical-align:1px}
.panel{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.panel > *{min-width:0}
.btn.warn{white-space:normal;text-align:left}
.intro{color:var(--mist);font-size:14px;max-width:60ch}
.card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px 14px;align-items:center;background:var(--deck);padding:12px 14px;
  box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),inset 0 3px 0 0 var(--deck-hi)}
.card .ic{width:44px;height:44px;object-fit:contain;background:var(--hull);padding:6px;align-self:start}
.card .cb{min-width:0;display:grid;gap:3px}
.card .ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.card .cn{font-family:var(--f-display);font-size:23px;line-height:1}
.card .cl{font-family:var(--f-label);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.card .cd{font-size:13.5px;color:var(--mist);line-height:1.35}
.card .ce{font-size:13.5px;color:var(--foam)}
.card .ce .nx{display:block;color:var(--brass)}
.card .cc{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.card.owned{opacity:.75}
@media (max-width:480px){
  .card{grid-template-columns:44px minmax(0,1fr)}
  .card .buy{grid-column:2;justify-self:start}
}

.sum{background:var(--deck);padding:14px 16px;display:grid;gap:10px;box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge)}
.sum .big{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--foam);display:flex;align-items:center;gap:8px}
.sum .big img{width:30px;height:30px}
.sum p{font-size:14px;color:var(--mist)}
.sum p b{color:var(--foam);font-weight:500}
.sum .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn.warn{background:var(--buoy);box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),inset 0 -3px 0 0 var(--buoy-lo),inset 0 3px 0 0 var(--buoy-hi)}

.dexhead{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.dexhead b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.dexhead span{color:var(--mist);font-size:14px}
.dexzone{display:grid;gap:8px}
.dexzone h3{font-family:var(--f-label);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--foam);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.dexzone h3 span{color:var(--mist);font-size:9px}
.dexzone h3 span.done{color:var(--kelp)}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.dx{background:var(--deck);padding:10px 8px 8px;display:grid;justify-items:center;gap:4px;text-align:center;min-width:0;
  box-shadow:-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge),0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge)}
.dx .pic{height:34px;display:flex;align-items:center;justify-content:center}
.dx img{height:auto;max-height:34px;max-width:72px}
.dx b{font-weight:600;font-size:13px;line-height:1.15}
.dx small{font-family:var(--f-label);font-size:9px;letter-spacing:.06em;color:var(--mist);text-transform:uppercase}
.dx.unk b{color:var(--mist)}
.erase{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:6px;color:var(--mist);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:20;background:var(--deck);color:var(--foam);padding:12px 16px;max-width:min(92vw,520px);font-size:15px;
  box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),inset 0 3px 0 0 var(--brass)}

@media (prefers-reduced-motion: reduce){
  .ft{animation:fade 1.3s forwards}
  .banner{animation:fade 2.6s forwards}
  .btn.cast.bite{animation:none}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
}
.home{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);text-decoration:none;padding:6px 0}
.home:hover{color:var(--foam)}
.home b{display:inline-block;width:10px;height:10px;background:var(--buoy);box-shadow:3px 3px 0 var(--edge)}
.homebar{max-width:1240px;margin:0 auto 10px}
body{margin:0}
</style>
</head>
<body>
<div class="homebar"><a class="home" href="./" id="homeLink"><b></b>&larr; Lanza Games</a></div>
<script>document.getElementById('homeLink').addEventListener('click',e=>{if(history.length>1&&document.referrer){e.preventDefault();history.back();}});</script>
<header class="top">
  <div class="brand">
    <img class="px" id="logo" alt="">
    <div>
      <h1>Driftwood Dock</h1>
    </div>
    <div class="angler" title="Every catch earns angler experience. Each level adds 2% to coin value.">
      <span id="lvl">Angler Lv 1</span>
      <div class="xpbar"><i id="xp"></i></div>
    </div>
  </div>
  <div class="res" id="res"></div>
  <button class="ghost" id="mute" type="button">Sound: on</button>
</header>

<main class="layout">
  <section class="harbor" aria-label="Fishing">
    <div class="scene frame">
      <canvas id="scene" width="240" height="135" aria-label="Fishing scene. Click to cast and to reel in."></canvas>
      <div class="fx" id="fx"></div>
      <div class="zonetag" id="zonetag"></div>
    </div>
    <div class="controls">
      <button class="btn cast" id="cast" type="button">Cast line</button>
      <p class="status" id="status" aria-live="polite">Click the water or press Space to cast.</p>
      <label class="auto" id="autoWrap" hidden><input type="checkbox" id="autoCast" checked> Auto-cast</label>
    </div>
    <dl class="stats">
      <div><dt>Avg bite</dt><dd id="stBite">-</dd></div>
      <div><dt>Luck</dt><dd id="stLuck">-</dd></div>
      <div><dt>Coin value</dt><dd id="stMult">-</dd></div>
      <div><dt>Crew income</dt><dd id="stCrew">-</dd></div>
    </dl>
    <div class="log frame">
      <h2>Catch log</h2>
      <ol id="log"><li class="empty">Nothing yet. The perch are waiting.</li></ol>
    </div>
  </section>

  <aside class="box frame" aria-label="Upgrades">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="panel" id="panel" role="tabpanel"></div>
  </aside>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const W = 240, H = 135, HZ = 72;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= DATA ================= */
const MATS = {
  wood:{name:'Driftwood', icon:'wood'},
  coral:{name:'Coral', icon:'coral'},
  teeth:{name:'Shark Teeth', icon:'tooth'},
  ink:{name:'Glow Ink', icon:'ink'},
  scale:{name:'Leviathan Scales', icon:'scale'},
  pearl:{name:'Pearls', icon:'pearl'},
};
const ZONES = [
  {name:'Old Pier', mat:'wood', mult:1, blurb:'Splintered planks, a lighthouse, and patient perch.'},
  {name:'Coral Reef', mat:'coral', mult:10, blurb:'Warm shallows full of bright, nervous fish.'},
  {name:'Open Sea', mat:'teeth', mult:100, blurb:'Deep blue water where the big hunters roam.'},
  {name:'The Abyss', mat:'ink', mult:1000, blurb:'Black water. Things down here make their own light.'},
  {name:"Kraken's Trench", mat:'scale', mult:10000, blurb:'The storm never ends. Something enormous lives below.'},
];
const BOATS = [null,
  {name:'Rowboat', coins:500, mats:{wood:40}},
  {name:'Sloop', coins:2e4, mats:{coral:120, pearl:8}},
  {name:'Trawler', coins:5e5, mats:{teeth:220, pearl:30}},
  {name:'Ironclad', coins:2e7, mats:{ink:350, pearl:90}},
];
const RAR = [
  {name:'Common', w:65, xp:1, mat:1},
  {name:'Uncommon', w:25, xp:2, mat:2},
  {name:'Rare', w:8, xp:5, mat:4},
  {name:'Epic', w:2, xp:12, mat:8},
  {name:'Legendary', w:0.3, xp:30, mat:20},
];
const sp = (id,name,z,r,val,tpl,col,x={}) => ({id,name,z,r,val,tpl,col,...x});
const SPECIES = [
  sp('boot','Old Boot',0,0,1,'boot',['#6b4a35','#8a6247','#3e2a1f','#c9b28a'],{junk:true}),
  sp('minnow','Minnow',0,0,2,'fish',['#9fb6c9','#e3ecf2','#6c8499','#ffffff']),
  sp('perch','Yellow Perch',0,0,3,'fish',['#d4b84a','#f2e6a8','#6f7d2e','#e0602f']),
  sp('sunfish','Pumpkinseed',0,1,9,'fish',['#5d9e8f','#f29a3a','#3c6b60','#ffd166']),
  sp('bass','Bigmouth Bass',0,1,14,'fish',['#5f8a4a','#d9e3b5','#3b5a2c','#ffffff']),
  sp('carp','Golden Carp',0,2,45,'fish',['#f0b429','#ffe28a','#c47b12','#fff3c4']),
  sp('pike','Pier Ghost Pike',0,3,140,'long',['#a9c7c9','#e8f1f1','#6c8f92','#77ffff']),
  sp('crown','Rusty Crown',0,4,520,'crown',['#c98a2b','#e8b860','#7a4f17','#d94a4a']),

  sp('clown','Clownfish',1,0,2.2,'fish',['#ff7b2e','#ffffff','#2b1d14','#ffffff']),
  sp('hermit','Hermit Crab',1,0,3,'crab',['#e05a47','#f4c09a','#8a2e22','#f0a090']),
  sp('parrot','Parrotfish',1,1,9,'fish',['#3fc1b0','#a8f0d8','#2a7f8f','#ff6fa8']),
  sp('puffer','Pufferfish',1,1,13,'round',['#e6c35c','#fbf0c4','#9c7a2a','#7a5a1a']),

function sprite(rows, pal, outline = '#0b0f1c'){
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const x = c.getContext('2d');
  const at = (i, j) => (j < 0 || j >= h || i < 0) ? '.' : (rows[j][i] ?? '.');
  if (outline){
    x.fillStyle = outline;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++){
      if (at(i, j) !== '.') continue;
      if (at(i-1,j) !== '.' || at(i+1,j) !== '.' || at(i,j-1) !== '.' || at(i,j+1) !== '.') x.fillRect(i+1, j+1, 1, 1);
    }
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++){
    const ch = at(i, j); if (ch === '.') continue;
    x.fillStyle = typeof pal === 'function' ? pal(ch) : (pal[ch] || '#ff00ff');
    x.fillRect(i+1, j+1, 1, 1);
  }
  return c;
}

function weights(lk){ return RAR.map((r, i) => r.w * Math.pow(1 + lk, i)); }
function roll(z, lk){
  const ws = weights(lk), tot = ws.reduce((a, b) => a + b, 0);
  let x = Math.random() * tot, r = 0;
  for (; r < ws.length - 1; r++){ x -= ws[r]; if (x < 0) break; }
  const pool = POOL[z][r];
  return pool[Math.floor(Math.random() * pool.length)];
}
function expected(z, lk){
  const ws = weights(lk), tot = ws.reduce((a, b) => a + b, 0);
  let e = 0;
  ws.forEach((w, r) => { const p = POOL[z][r]; e += w / tot * p.reduce((a, s) => a + s.val, 0) / p.length; });
  return e * ZONES[z].mult * coinMult();
}
function tierMat(L, size, base){
  const t = Math.min(4, Math.floor(L / size));
  return {[ZONES[t].mat]: base * (t + 1) * Math.pow(1.28, L - t * size)};
}

function award(s, {perfect = false, crew = false} = {}){
  const z = ZONES[s.z], r = RAR[s.r];
  const coins = s.val * z.mult * coinMult() * (perfect ? 1.5 : 1) * (crew ? crewMult() : 1);
  S.coins += coins; S.runCoins += coins; S.lifeCoins += coins;
  const m = r.mat + (s.junk ? 2 : 0);
  S.mats[z.mat] += m;
  let pearls = 0;
  if (s.r === 2 && Math.random() < 0.4) pearls = 1;
  else if (s.r === 3) pearls = Math.random() < 0.5 ? 2 : 1;
  else if (s.r === 4) pearls = 3;
  S.mats.pearl += pearls;
  const isNew = !S.dex[s.id];
  S.dex[s.id] = (S.dex[s.id] || 0) + 1;
  if (isNew) dexDirty = true;
  S.catches++; addXp(r.xp);
  return {s, coins, m, mat:z.mat, pearls, isNew};
}

function catchUp(sec, report){
  sec = Math.min(sec, 8 * 3600);
  const c0 = S.coins, m0 = {...S.mats};
  let fish = 0;
  const sim = (count, lk, opts, withExtra) => {
    if (count <= 0) return;
    const k = Math.min(count, 3000), cb = S.coins, mb = {...S.mats};
    for (let i = 0; i < k; i++){
      let n = 1;
      if (withExtra){ const e = 0.1 * S.up.reel; n += Math.floor(e) + (Math.random() < e % 1 ? 1 : 0); }
      for (let j = 0; j < n; j++){ award(roll(S.zone, lk), opts); fish++; }
    }
    const scale = count / k - 1;
    if (scale > 0){
      const gain = S.coins - cb; S.coins += gain * scale; S.runCoins += gain * scale; S.lifeCoins += gain * scale;
      for (const m in S.mats) S.mats[m] += Math.round((S.mats[m] - mb[m]) * scale);
      fish += Math.round(k * scale);
    }
  };
  sim(Math.floor(sec / crewInterval() * S.up.crew), luck() * 0.5, {crew:true}, false);
  if (S.up.chair && S.up.bell && S.autoCast) sim(Math.floor(sec / (biteTime() + PERFECT + 0.12 + 1.6)), luck(), {}, true);
  if (report && fish > 0){
    const mats = Object.keys(S.mats).filter(m => S.mats[m] - m0[m] > 0).map(m => `${fmt(S.mats[m] - m0[m])} ${MATS[m].name}`);
    toast(`While you were away (${fmtDur(sec)}): ${fmt(fish)} fish, +${fmt(S.coins - c0)} coins${mats.length ? ', ' + mats.join(', ') : ''}.`, 7000);
  }
}

    drawMan(CREWSPR[i], cx, cy, tip);
    fishLine(tip.x, tip.y, b.x, b.y, 6);
    bobber(b.x, b.y + Math.round(Math.sin(t * 2.6 + i * 1.7) * .7));
  }
  // player
  const fx = z === 0 ? 52 : 54, fy = deck - 13;
  let tip = {x:fx + 22, y:fy - 14}, bob = null, fishPos = null;
  if (P.st === 'casting'){
    const p = clamp(P.t / P.dur, 0, 1);
    tip = p < .3 ? {x:fx + 2, y:fy - 15} : {x:fx + 25, y:fy - 10};
    bob = {x:tip.x + (P.bx - tip.x) * p, y:tip.y + (P.by - tip.y) * p - Math.sin(p * Math.PI) * 28};
  } else if (P.st === 'waiting'){
    tip = {x:fx + 25, y:fy - 11}; bob = {x:P.bx, y:P.by + Math.round(Math.sin(t * 3) * .7)};
  } else if (P.st === 'bite'){
    tip = {x:fx + 26, y:fy - 5 + (Math.floor(t * 20) % 2)}; bob = {x:P.bx, y:P.by + 2 + (Math.floor(t * 16) % 2)};
  } else if (P.st === 'reeling'){
    const p = clamp(P.t / P.dur, 0, 1);
    tip = {x:fx + 20, y:fy - 15};
    fishPos = {x:P.bx + (fx + 14 - P.bx) * p, y:P.by + (fy + 2 - P.by) * p - Math.sin(p * Math.PI) * 26};
  }
  drawMan(PLAYER, fx, fy, tip);
  if (bob){ fishLine(tip.x, tip.y, bob.x, bob.y, P.st === 'bite' ? 1 : 8); bobber(Math.round(bob.x), Math.round(bob.y)); }
  if (fishPos && P.fish){
    fishLine(tip.x, tip.y, fishPos.x, fishPos.y - 2, 0);
    const spr = SPRF[P.fish.id];
    g.drawImage(spr, Math.round(fishPos.x - spr.width / 2), Math.round(fishPos.y - spr.height / 2));
  }
  if (P.st === 'bite') bang(fx + 3, fy - 16, P.t <= PERFECT ? '#ffe27a' : '#ff6a3d');
  // splash particles
  g.fillStyle = PAL[z].hi;
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.vy += 90 * dt; p.x += p.vx * dt; p.y += p.vy * dt; px(p.x, p.y);
  }
}

/* ================= FX OVERLAY ================= */
const fxEl = $('#fx');
function floatText(x, y, text, cls = ''){
  if (fxEl.childElementCount > 24) return;
  const d = document.createElement('div'); d.className = 'ft ' + cls; d.textContent = text;
  d.style.left = (x / W * 100) + '%'; d.style.top = (y / H * 100) + '%';
  d.addEventListener('animationend', () => d.remove()); fxEl.appendChild(d);
}
function banner(kicker, name, r){
  fxEl.querySelectorAll('.banner').forEach(b => b.remove());
  const d = document.createElement('div'); d.className = 'banner frame';
  d.innerHTML = `<small class="r${r}">${kicker}</small><b class="r${r}">${name}</b>`;
  d.addEventListener('animationend', () => d.remove()); fxEl.appendChild(d);
}
let toastTimer = 0;
function toast(msg, ms = 4200){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, ms); }

/* ================= UPGRADES ================= */
const UP = {
  rod:{name:'Rod', icon:'rod', max:40, desc:'Fish bite sooner, and rare fish bite more often.',
    title:L => ROD_NAMES[Math.min(4, Math.floor(L / 8))],
    cost:L => ({coins:12 * 1.5 ** L, ...tierMat(L, 8, 5)}),
    eff:L => `Bite ${secs(biteTime(L))}, luck +${Math.round(L * 3)}%`},
  bait:{name:'Bait Bucket', icon:'bait', max:30, desc:'Juicier bait draws rarer fish. Pearls buy the good stuff.',
    cost:L => ({coins:30 * 1.6 ** L, ...(L > 0 ? {pearl:L * 1.5} : {})}),
    eff:L => `Luck +${L * 5}%`},
  reel:{name:'Reel', icon:'reel', max:25, desc:'A chance to land extra fish on each hook, and a longer window to hook them.',
    cost:L => ({coins:60 * 1.65 ** L, ...tierMat(L, 5, 8)}),
    eff:L => `+${L * 10}% extra fish, ${secs(hookWindow(L))} window`},
  market:{name:'Market Stall', icon:'market', max:30, desc:'Better prices for everything you land.',
    cost:L => ({coins:100 * 1.75 ** L, ...tierMat(L, 6, 10)}),
    eff:L => `Fish sell for +${L * 25}%`},
  crew:{name:'Deckhands', icon:'crew', max:12, desc:'Each deckhand lands fish on their own, even while you are away.',
    cost:L => ({coins:80 * 2 ** L, ...tierMat(L, 2.5, 15)}),
    eff:L => `${L} deckhand${L === 1 ? '' : 's'}`, btn:'Hire'},
  galley:{name:'Galley', icon:'galley', max:25, desc:'Hot chowder keeps the crew fishing faster.',
    cost:L => ({coins:200 * 1.7 ** L, ...tierMat(L, 5, 12)}),
    eff:L => `A fish every ${secs(crewInterval(L))} each`},
  shanty:{name:'Shanty Book', icon:'shanty', max:25, desc:'Good songs, good spirits. Crew catches sell for more.',
    cost:L => ({coins:250 * 1.8 ** L, pearl:2 + L * 1.5}),
    eff:L => `Crew catches +${L * 30}%`},
  chair:{name:'Fishing Chair', icon:'chair', max:1, desc:'Recasts your line by itself after every catch.',
    cost:() => ({coins:300, wood:30}), eff:L => L ? 'Installed' : 'Not installed', btn:'Install'},
  bell:{name:'Rod Bell', icon:'bell', max:1, desc:'Rings and hooks bites for you. Click before it rings to still get a Perfect hook.',
    cost:() => ({coins:2500, coral:60}), eff:L => L ? 'Installed' : 'Not installed', btn:'Install'},
};
function lvlItem(k){
  const d = UP[k];
  const L = () => S.up[k], maxed = () => L() >= d.max;
  return {
    key:k, icon:ICONURL[d.icon], desc:d.desc,
    name:() => d.title ? d.title(L()) : d.name,
    lvl:() => d.max === 1 ? '' : `Lv ${L()}${maxed() ? ' · max' : ''}`,
    eff:() => maxed() ? d.eff(L()) : `${d.eff(L())}<span class="nx">Next: ${d.eff(L() + 1)}</span>`,
    cost:() => maxed() ? null : normCost(d.cost(L())),
    lock:() => maxed() ? (d.max === 1 ? 'Installed' : 'Maxed') : lockFor(d.cost(L())),
    label:() => d.btn || 'Upgrade',
    owned:maxed,
    buy:() => {
      if (maxed() || !pay(normCost(d.cost(L())))) return;
      S.up[k]++; sfx.buy();
      if (k === 'crew') syncCrew();
      if (k === 'chair'){ $('#autoWrap').hidden = false; if (P.st === 'idle' && S.autoCast) P.auto = .4; toast('Fishing Chair installed. Your line now recasts by itself.'); }
      if (k === 'bell') toast('Rod Bell installed. It hooks bites you miss.');
    },
  };
}
function travel(i){
  if (i === S.zone) return;
  S.zone = i; P.st = 'idle'; P.t = 0; P.fish = null; P.auto = S.up.chair && S.autoCast ? .6 : 0;
  parts.length = 0; ripples.length = 0; panelDirty = true;
  status(`Now fishing at ${ZONES[i].name}.`);
}
function zoneItem(i){
  const z = ZONES[i], b = BOATS[i];
  const cost = () => i === S.boat + 1 ? normCost({coins:b.coins, ...b.mats}) : null;
  return {
    key:'z' + i, icon:ICONURL[MATS[z.mat].icon], desc:`${z.blurb} Drops ${MATS[z.mat].name}.`,
    name:() => z.name,
    lvl:() => i === S.zone ? 'Fishing here' : i <= S.boat ? 'Charted' : 'Uncharted',
    eff:() => `${i <= S.boat ? foundIn(i) : '?'} / ${BYZ[i].length} species found, fish worth x${fmt(z.mult)}`,
    cost,
    lock:() => i === S.zone ? 'Here' : i <= S.boat ? null : i > S.boat + 1 ? `Needs ${b.name}` : lockFor(cost()),
    label:() => i <= S.boat ? 'Sail here' : `Buy ${b.name}`,
    owned:() => false,
    buy:() => {
      if (i <= S.boat){ travel(i); sfx.buy(); return; }
      if (i !== S.boat + 1 || !pay(cost())) return;
      S.boat = i; travel(i); sfx.buy(); panelDirty = true;
      toast(`You bought the ${b.name}. Welcome to ${z.name}.`);
    },
  };
}
const PERKS = [
  {k:'seaLegs', name:'Sea Legs', icon:'boat', cost:2, desc:'Start every voyage with the Rowboat, so the Coral Reef is charted from the first cast.'},
  {k:'oldSalts', name:'Old Salts', icon:'crew', cost:3, desc:'Three deckhands sign on at the start of every voyage.'},
  {k:'comforts', name:'Creature Comforts', icon:'chair', cost:3, desc:'Keep the Fishing Chair and Rod Bell between voyages.'},
  {k:'moon', name:'Moon Charm', icon:'moon', cost:5, desc:'+30% luck on every cast, forever.'},
  {k:'heirloom', name:'Heirloom Rod', icon:'rod', cost:8, desc:'Start every voyage holding a level 8 Bamboo Rod.'},
];
function applyPerks(){
  if (S.perks.seaLegs) S.boat = Math.max(S.boat, 1);
  if (S.perks.oldSalts) S.up.crew = Math.max(S.up.crew, 3);
  if (S.perks.comforts){ S.up.chair = 1; S.up.bell = 1; }
  if (S.perks.heirloom) S.up.rod = Math.max(S.up.rod, 8);
  syncCrew(); $('#autoWrap').hidden = !S.up.chair;
}
function perkItem(p){
  return {
    key:'p_' + p.k, icon:ICONURL[p.icon], desc:p.desc,
    name:() => p.name, lvl:() => S.perks[p.k] ? 'Bound' : 'Tide Charm', eff:() => '',
    cost:() => S.perks[p.k] ? null : {tide:p.cost},
    lock:() => S.perks[p.k] ? 'Bound' : null,
    label:() => 'Bind charm', owned:() => !!S.perks[p.k],
    buy:() => { if (S.perks[p.k] || !pay({tide:p.cost})) return; S.perks[p.k] = true; sfx.buy(); applyPerks(); toast(`${p.name} is bound to you.`); },
  };
}
function voyage(){
  const gain = tideGain(); if (!tideOpen() || gain < 1) return;
  const keep = {dex:S.dex, xp:S.xp, level:S.level, tide:S.tide + gain, tideTotal:S.tideTotal + gain, perks:S.perks, catches:S.catches, voyages:S.voyages + 1, lifeCoins:S.lifeCoins, autoCast:S.autoCast, muted:S.muted};
  S = Object.assign(fresh(), keep);
  crewT = []; applyPerks(); S.zone = 0;
  P.st = 'idle'; P.t = 0; P.fish = null; P.auto = 0; LOG.length = 0; renderLog();
  parts.length = 0; ripples.length = 0;
  panelDirty = true; resSig = '';
  sfx.catch(4);
  toast(`The tide gives you ${gain} Tide Pearl${gain > 1 ? 's' : ''}. Every coin is now worth ${Math.round(S.tideTotal * 10)}% more.`, 6000);
  save();
}

/* ================= PANEL UI ================= */
const TABS = [['tackle','Tackle'],['crew','Crew'],['waters','Waters'],['dex','Fishdex'],['tide','Tide']];
const INTRO = {
  tackle:'Better gear means faster bites and rarer fish. Higher tiers need materials from deeper water.',
  crew:'Deckhands fish from the current waters on their own, including while this page is closed (up to 8 hours).',
  waters:'Each boat opens deeper water. Fish there are worth far more and drop new materials for your gear.',
};
let tab = 'tackle', items = [], panelDirty = true, dexDirty = false, confirmTide = 0, confirmErase = 0;
try { tab = localStorage.getItem('driftwood-dock-tab') || 'tackle'; } catch {}
if (!TABS.some(t => t[0] === tab)) tab = 'tackle';
const tabsEl = $('#tabs'), panel = $('#panel');
function renderTabs(){
  tabsEl.innerHTML = TABS.map(([k, n]) => `<button class="tab" role="tab" type="button" id="tab-${k}" data-tab="${k}" aria-selected="${k === tab}">${n}<span class="dot" hidden></span></button>`).join('');
}
function cardHTML(it){
  return `<div class="card" data-k="${it.key}"><img class="ic px" src="${it.icon}" alt="">
    <div class="cb"><div class="ch"><span class="cn"></span><span class="cl"></span></div><p class="cd">${it.desc}</p><p class="ce"></p><div class="cc"></div></div>
    <button class="btn buy" type="button" id="buy-${it.key}" data-k="${it.key}"></button></div>`;
}
function renderPanel(){
  panelDirty = false; dexDirty = false;
  if (tab === 'tackle') items = ['rod','bait','reel','market'].map(lvlItem);
  else if (tab === 'crew') items = ['crew','galley','shanty','chair','bell'].map(lvlItem);
  else if (tab === 'waters') items = ZONES.map((_, i) => zoneItem(i));
  else if (tab === 'tide') items = tideOpen() ? PERKS.map(perkItem) : [];
  else items = [];
  let h = '';
  if (INTRO[tab]) h += `<p class="intro">${INTRO[tab]}</p>`;
  if (tab === 'dex') h += dexHTML();
  if (tab === 'tide') h += tideHTML();
  h += items.map(cardHTML).join('');
  if (tab === 'tide') h += `<div class="erase"><span>Saved in this browser. ${fmt(S.catches)} fish caught across ${S.voyages + 1} voyage${S.voyages ? 's' : ''}.</span><button class="ghost" id="eraseBtn" type="button">Erase save</button></div>`;
  panel.innerHTML = h;
  panel.setAttribute('aria-labelledby', 'tab-' + tab);
  updatePanel();
}
function tideHTML(){
  if (!tideOpen()) return `<div class="sum"><p><b>The tide only answers anglers who have reached The Abyss.</b> Buy the Trawler to get there.</p>
    <p>Once you do, you can return your catch to the tide. You give up coins, materials, gear, crew and boats, and get Tide Pearls in exchange. Every Tide Pearl you ever earn makes all coins worth 10% more, and you can spend them on charms that carry over. Your Fishdex and angler level always stay.</p></div>`;
  return `<div class="sum">
    <div class="big"><img class="px" src="${ICONURL.tide}" alt=""><span id="tideHave"></span></div>
    <p id="tideInfo"></p>
    <div class="row"><button class="btn warn" id="tideBtn" type="button"></button></div>
    <p>Starting a new voyage resets coins, materials, gear, crew and boats. Your Fishdex, angler level and Tide Charms stay.</p>
  </div>`;
}
function dexHTML(){
  const n = dexCount();
  let h = `<div class="dexhead"><b>${n} / ${SPECIES.length}</b><span>species found. Each one adds 3% to coin value (now +${n * 3}%). Finishing a waters adds 10% luck.</span></div>`;
  ZONES.forEach((z, zi) => {
    const f = foundIn(zi), done = f === BYZ[zi].length;
    h += `<section class="dexzone"><h3>${z.name}<span class="${done ? 'done' : ''}">${done ? 'Complete · +10% luck' : `${f} / ${BYZ[zi].length}`}</span></h3><div class="dexgrid">`;
    h += BYZ[zi].map(s => {
      const c = S.dex[s.id];
      return c ? `<div class="dx" title="${s.name}: ${RAR[s.r].name}, worth ${fmt(s.val * z.mult)} base"><div class="pic"><img class="px" src="${SPRURL[s.id]}" alt=""></div><b class="r${s.r}">${s.name}</b><small>${RAR[s.r].name} · x${fmt(c)}</small></div>`
               : `<div class="dx unk" title="Not found yet"><div class="pic"><img class="px" src="${SILURL[s.id]}" alt=""></div><b>???</b><small class="r${s.r}">${RAR[s.r].name}</small></div>`;
    }).join('');
    h += `</div></section>`;
  });
  return h;
}
function updatePanel(){
  for (const it of items){
    const el = panel.querySelector(`.card[data-k="${it.key}"]`); if (!el) continue;
    setText(el.querySelector('.cn'), it.name());
    setText(el.querySelector('.cl'), it.lvl());
    const ce = el.querySelector('.ce'), e = it.eff(); setHTML(ce, e); ce.hidden = !e;
    const c = it.cost(); setHTML(el.querySelector('.cc'), c ? costHTML(c) : '');
    const lock = it.lock(), btn = el.querySelector('.buy');
    btn.disabled = !!lock || (c ? !afford(c) : false);
    setText(btn, lock || it.label());
    el.classList.toggle('owned', it.owned());
  }
  if (tab === 'tide' && tideOpen()){
    const gain = tideGain();
    setText($('#tideHave'), `${S.tide} Tide Pearl${S.tide === 1 ? '' : 's'}`);
    const next = Math.pow(gain + 1, 2) * 1e6;
    setHTML($('#tideInfo'), `Earned in total: <b>${S.tideTotal}</b> (+${S.tideTotal * 10}% coins). Coins this voyage: <b>${fmt(S.runCoins)}</b>. Returning now gives <b>${gain}</b> Tide Pearl${gain === 1 ? '' : 's'}; the next one comes at ${fmt(next)} coins.`);
    const btn = $('#tideBtn');
    btn.disabled = gain < 1;
    setText(btn, gain < 1 ? `Earn ${fmt(1e6)} coins this voyage first` : confirmTide > performance.now() ? 'Click again to confirm' : `Return to the tide (+${gain})`);
  }
  if (tab === 'dex' && dexDirty) renderPanel();
}
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem('driftwood-dock-tab', tab); } catch {}
  tabsEl.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  renderPanel();
});
panel.addEventListener('click', e => {
  const b = e.target.closest('.buy');
  if (b){ const it = items.find(i => i.key === b.dataset.k); if (it){ it.buy(); if (panelDirty) renderPanel(); else updatePanel(); } return; }
  if (e.target.id === 'tideBtn'){
    if (confirmTide > performance.now()){ confirmTide = 0; voyage(); renderPanel(); }
    else { confirmTide = performance.now() + 4000; updatePanel(); }
  }
  if (e.target.id === 'eraseBtn'){
    if (confirmErase > performance.now()){
      confirmErase = 0; try { localStorage.removeItem(SAVE_KEY); } catch {}
      S = fresh(); crewT = []; LOG.length = 0; renderLog(); P.st = 'idle'; P.auto = 0; $('#autoWrap').hidden = true; resSig = ''; renderPanel(); toast('Save erased. A fresh start at the Old Pier.');
    } else { confirmErase = performance.now() + 4000; e.target.textContent = 'Click again to erase everything'; setTimeout(() => { const b = $('#eraseBtn'); if (b) b.textContent = 'Erase save'; }, 4000); }
  }
});
function tabDots(){
  const any = list => list.some(it => { const c = it.cost(); return c && !it.lock() && afford(c); });
  const map = {tackle:['rod','bait','reel','market'].map(lvlItem), crew:['crew','galley','shanty','chair','bell'].map(lvlItem), waters:[zoneItem(Math.min(4, S.boat + 1))]};
  for (const k in map){ const d = tabsEl.querySelector(`[data-tab="${k}"] .dot`); if (d) d.hidden = (k === 'waters' && S.boat >= 4) || !any(map[k]); }
}

/* ================= HEADER / STATS ================= */
let resSig = '';
function updateRes(){
  const keys = ['coins', ...Object.keys(MATS).filter(m => S.mats[m] > 0 || (m !== 'pearl' && ZONES.findIndex(z => z.mat === m) <= S.boat))];
  if (S.tideTotal > 0) keys.push('tide');
  const sig = keys.join();
  const res = $('#res');
  if (sig !== resSig){ resSig = sig; res.innerHTML = keys.map(k => `<span class="chip ${k === 'coins' ? 'coins' : ''}" data-r="${k}" title="${resName(k)}"><img class="px" src="${ICONURL[resIcon(k)]}" alt="${resName(k)}"><span></span></span>`).join(''); }
  res.querySelectorAll('[data-r]').forEach(el => setText(el.lastElementChild, fmt(have(el.dataset.r))));
  setText($('#lvl'), `Angler Lv ${S.level}`);
  $('#xp').style.width = clamp(S.xp / xpNeed(S.level) * 100, 0, 100) + '%';
  setText($('#stBite'), secs(biteTime()));
  setText($('#stLuck'), `+${Math.round(luck() * 100)}%`);
  setText($('#stMult'), `x${coinMult() < 10 ? coinMult().toFixed(2) : fmt(coinMult())}`);
  setText($('#stCrew'), S.up.crew ? `${fmt(S.up.crew / crewInterval() * expected(S.zone, luck() * .5) * crewMult())}/s` : 'none');
  setText($('#zonetag'), S.zone === 0 ? 'Old Pier' : `${ZONES[S.zone].name} · ${BOATS[S.boat].name}`);
  const cb = $('#cast');
  const lab = P.st === 'idle' ? (P.auto > 0 ? 'Recasting...' : 'Cast line') : P.st === 'bite' ? 'Reel in!' : P.st === 'reeling' ? 'Landing...' : 'Waiting...';
  setText(cb, lab);
  cb.className = 'btn cast' + (P.st === 'bite' ? ' bite' : (P.st === 'idle' ? '' : ' wait'));
  setHTML($('#status'), statusMsg);
}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown', e => { e.preventDefault(); act(); });
$('#cast').addEventListener('click', act);
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button,input,select,textarea,a')) return;
  if (e.code === 'Space' || e.key === 'f' || e.key === 'F'){ e.preventDefault(); act(); }
});
$('#autoCast').addEventListener('change', e => { S.autoCast = e.target.checked; if (S.autoCast && P.st === 'idle') P.auto = .4; else P.auto = 0; });
$('#mute').addEventListener('click', () => { S.muted = !S.muted; setText($('#mute'), S.muted ? 'Sound: off' : 'Sound: on'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ================= LOOP ================= */
let lastT = 0, uiAcc = 0, panelAcc = 0, saveAcc = 0;
function loop(now){
  let dt = lastT ? (now - lastT) / 1000 : 0; lastT = now;
  if (dt > 2){ catchUp(dt, dt > 30); dt = 0; }
  updatePlayer(dt); updateCrew(dt);
  draw(now / 1000, dt);
  uiAcc += dt; panelAcc += dt; saveAcc += dt;
  if (uiAcc > .1){ uiAcc = 0; updateRes(); }
  if (panelAcc > .25){ panelAcc = 0; if (panelDirty) renderPanel(); else updatePanel(); tabDots(); }
  if (saveAcc > 5){ saveAcc = 0; save(); }
  requestAnimationFrame(loop);
}

function start(data){
  const saved = data && data.S ? merge(fresh(), data.S) : loadSave();
  if (saved) S = saved;
  if (S.zone > S.boat) S.zone = S.boat;
  syncCrew();
  $('#autoWrap').hidden = !S.up.chair;
  $('#autoCast').checked = S.autoCast;
  setText($('#mute'), S.muted ? 'Sound: off' : 'Sound: on');
  $('#logo').src = sprite(TPL.fish, {'1':'#f0b429','2':'#ffe28a','3':'#c47b12','4':'#0b0f1c','5':'#fff3c4'}).toDataURL();
  renderTabs(); renderPanel(); renderLog();
  if (saved && !(data && data.S)){
    const away = (Date.now() - (S.last || Date.now())) / 1000;
    if (away > 30) catchUp(away, true);
  }
  if (S.up.chair && S.autoCast) P.auto = .8;
  updateRes();
  window.claude?.hot?.snapshot?.(() => ({S}));
  requestAnimationFrame(loop);
}
const hot = window.claude?.hot;
hot?.ready ? hot.ready(start) : start(hot?.data ?? {});
})();
</script>
